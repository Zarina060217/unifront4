<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assignment unifront 4</title>
    </head>
    <body>
        <p> Task 0 + 1</p>
        <h3>Contact us</h3>
        <form action="#" method="POST">
            <div>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required minlength="2" maxlength="50" placeholder="Enter your name">
            </div><br>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div><br>
            <div>
                <label for="meassage">Message:</label><br>
                <textarea name="meassage" id="meassage" rows="4" cols="50" required minlength="10" placeholder="Type your message here..."></textarea><br>
            </div><br>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </body>
</html>
