<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Assignment unifront 4</title>
    </head>
    <body>
        <p> Task 0 + 1</p>
        <h3>Contact us</h3>
        <form action="#" method="POST">
            <div>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required minlength="2" maxlength="50" placeholder="Enter your name">
            </div><br>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div><br>
            <div>
                <label for="meassage">Message:</label><br>
                <textarea name="meassage" id="meassage" rows="4" cols="50" required minlength="10" placeholder="Type your message here..."></textarea><br>
            </div><br>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>

        <hr>
        <p> Task 2</p>

        <div class="container">
            <h3>Contact Us</h3>
            <form class="row g-3" novalidate>
                <div class="col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    <div class="valid-feedback">Normal</div>
                    <div class="invalid-feedback">Name is required</div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    <div class="valid-feedback">Normal</div>
                    <div class="invalid-feedback">Enter a valid email</div>
                </div>

                <div class="col-12">
                    <label for="message" class="form-label">Message:</label>
                    <textarea class="form-control" id="message" placeholder="Enter your message" required></textarea>
                    <div class="valid-feedback">Normal</div>
                    <div class="invalid-feedback">Message is required</div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>

        <script>
            document.querySelector("form").addEventListener("submit", function(event){
                event.preventDefault();

                this.querySelectorAll("input, textarea").forEach(field => {
                    const valid = field.checkValidity();
                    field.classList.toggle("is-valid", valid);
                    field.classList.toggle("is-invalid", !valid);
                });
            });
        </script>
    </body>
</html>
